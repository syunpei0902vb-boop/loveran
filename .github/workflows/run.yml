name: loveran monitor

on:
  schedule:
    - cron: '0 * * * *'  # 1時間ごと
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install libs
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        run: python loveran_monitor.py
